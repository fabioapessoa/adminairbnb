<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142B3B">
<title>Admin | Coronado Del Mar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#142B3B; --teal:#176B75; --ivory:#FAF8F4; --sand:#E9DFD0; --gold:#B69A72; --gray:#707A80;
    --white:#fff; --line:#E6DECB; --err:#A23B2E; --ok:#1F6F5C;
    --serif:'Playfair Display', Georgia, serif; --sans:'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ivory); color:var(--navy); font:15px/1.5 var(--sans); }
  h1, h2 { font-family: var(--serif); font-weight: 700; margin: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 60px; }
  input, button, select { font: inherit; }
  input { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); color: var(--navy); }
  input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23,107,117,.12); }

  .btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; font-weight: 600; font-size: 13.5px; }
  .btn.ghost { background: #fff; color: var(--navy); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--teal); color: var(--teal); }

  #login { max-width: 360px; margin: 16vh auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 1px 2px rgba(20,43,59,.05), 0 8px 24px rgba(20,43,59,.07); }
  #login .eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  #login h1 { font-size: 24px; margin: 6px 0 20px; }
  #login input { width: 100%; margin: 0 0 12px; }
  #loginErr { color: var(--err); min-height: 18px; font-size: 13px; margin-bottom: 8px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .topbar .eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; display: block; margin-bottom: 2px; }
  .topbar h1 { font-size: 22px; }
  .actions { display: flex; gap: 8px; }

  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .tab { padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; font-weight: 600; color: var(--gray); font-size: 13.5px; }
  .tab.on { background: var(--navy); color: #fff; }
  .grow { flex: 1; min-width: 180px; }

  .stat-row { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 18px; }
  @media (min-width: 640px) { .stat-row { grid-template-columns: repeat(4,1fr); } }
  .stat { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .n { font-family: var(--serif); font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: .05em; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .head { display: grid; grid-template-columns: 1.6fr 1.2fr 90px 90px; gap: 10px; padding: 14px 16px; cursor: pointer; align-items: center; }
  @media (max-width: 640px) { .head { grid-template-columns: 1fr 1fr; } }
  .name { font-weight: 700; }
  .muted { color: var(--gray); font-size: 12.5px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
  .pill.now { background: #E3F0EC; color: var(--ok); }
  .pill.soon { background: #E6EFF0; color: var(--teal); }
  .pill.past { background: #EFEAE0; color: var(--gray); }
  .body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .card.open .body { display: block; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 7px 12px; margin: 12px 0; }
  dt { color: var(--gray); font-size: 13px; }
  dd { margin: 0; word-break: break-word; font-size: 13.5px; }
  ul.g { margin: 4px 0 0; padding-left: 18px; }
  .links { display: flex; gap: 18px; margin-top: 6px; }
  .links a { color: var(--teal); font-weight: 600; text-decoration: none; font-size: 13.5px; }
  .links a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--gray); padding: 56px 0; background: var(--white); border: 1px dashed var(--line); border-radius: 12px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" style="display:none">
    <span class="eyebrow">Coronado Del Mar</span>
    <h1>Admin Access</h1>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <div id="loginErr"></div>
      <button class="btn" style="width:100%">Sign in</button>
    </form>
  </div>

  <div id="app" style="display:none">
    <div class="topbar">
      <div><span class="eyebrow">Coronado Del Mar · Unit 15</span><h1>Guest check-ins</h1></div>
      <div class="actions">
        <a class="btn ghost" id="csv" href="/api/admin/export" style="text-decoration:none;display:inline-block">Export CSV</a>
        <button class="btn ghost" id="logout">Sign out</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="n" id="statTotal">—</div><div class="l">Showing</div></div>
      <div class="stat"><div class="n" id="statGuests">—</div><div class="l">Total guests</div></div>
      <div class="stat"><div class="n" id="statPets">—</div><div class="l">With pets</div></div>
      <div class="stat"><div class="n" id="statWa">—</div><div class="l">Prefer WhatsApp</div></div>
    </div>

    <div class="bar">
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="upcoming">Upcoming</button>
        <button class="tab" data-f="current">Staying now</button>
        <button class="tab" data-f="past">Past</button>
        <button class="tab" data-f="all">All</button>
      </div>
      <input class="grow" id="q" placeholder="Search name, email or phone">
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let filter = 'upcoming', timer;

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  return res;
}

function showLogin() { $('#app').style.display = 'none'; $('#login').style.display = 'block'; }
function showApp() { $('#login').style.display = 'none'; $('#app').style.display = 'block'; load(); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  const res = await fetch('/api/admin/session', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ password: $('#pw').value }),
  });
  if (res.ok) { $('#pw').value = ''; showApp(); }
  else $('#loginErr').textContent = 'Wrong password';
});

$('#logout').addEventListener('click', async () => {
  await fetch('/api/admin/session', { method: 'DELETE' });
  showLogin();
});

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === b));
  filter = b.dataset.f; load();
});
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });

const day = (v) => String(v).slice(0, 10);
function status(r) {
  const today = new Date().toISOString().slice(0, 10);
  if (day(r.check_out) < today) return ['past', 'Past'];
  if (day(r.check_in) <= today) return ['now', 'Staying'];
  return ['soon', 'Upcoming'];
}

function row(r) {
  const [cls, label] = status(r);
  const guests = (r.guests || []).map((g) => `<li>${esc(g.name)}${g.relation ? ', ' + esc(g.relation) : ''}</li>`).join('');
  const phone = String(r.resp_phone).replace(/[^\d+]/g, '');
  return `<div class="card">
    <div class="head">
      <div><div class="name">${esc(r.resp_name)}</div><div class="muted">${esc(r.platform || '—')}</div></div>
      <div>${esc(day(r.check_in))} → ${esc(day(r.check_out))}</div>
      <div>${(r.guests || []).length + 1} guests</div>
      <div><span class="pill ${cls}">${label}</span></div>
    </div>
    <div class="body">
      <dl>
        <dt>Email</dt><dd>${esc(r.resp_email)}</dd>
        <dt>Phone</dt><dd>${esc(r.resp_phone)}</dd>
        <dt>Address</dt><dd>${esc(r.resp_address || '—')}</dd>
        <dt>Vehicles</dt><dd>${esc(r.vehicles || '—')}</dd>
        <dt>Pets</dt><dd>${esc(r.pets || '—')}</dd>
        <dt>Arrival</dt><dd>${esc(r.arrival_time || '—')}</dd>
        <dt>Contact</dt><dd>${esc(r.contact_pref)}</dd>
        <dt>Other guests</dt><dd>${guests ? '<ul class="g">' + guests + '</ul>' : '—'}</dd>
        <dt>Notes</dt><dd>${esc(r.notes || '—')}</dd>
        <dt>Submitted</dt><dd>${esc(new Date(r.created_at).toLocaleString())}</dd>
      </dl>
      <div class="links">
        <a href="https://wa.me/${esc(phone.replace('+', ''))}" target="_blank" rel="noopener">WhatsApp</a>
        <a href="mailto:${esc(r.resp_email)}">Email</a>
      </div>
    </div>
  </div>`;
}

function renderStats(rows) {
  const totalGuests = rows.reduce((n, r) => n + (r.guests || []).length + 1, 0);
  $('#statTotal').textContent = rows.length;
  $('#statGuests').textContent = totalGuests;
  $('#statPets').textContent = rows.filter((r) => r.pets).length;
  $('#statWa').textContent = rows.filter((r) => r.contact_pref === 'whatsapp').length;
}

async function load() {
  try {
    const res = await api(`/api/admin/list?filter=${filter}&q=${encodeURIComponent($('#q').value)}`);
    const { rows } = await res.json();
    $('#list').innerHTML = rows.length ? rows.map(row).join('') : '<div class="empty">No check-ins here yet.</div>';
    renderStats(rows);
  } catch {
    toast('Could not load check-ins. Please try again.');
  }
}

$('#list').addEventListener('click', (e) => {
  const head = e.target.closest('.head');
  if (head) head.parentElement.classList.toggle('open');
});

(async () => {
  const r = await fetch('/api/admin/session').then((x) => x.json()).catch(() => ({}));
  r.authed ? showApp() : showLogin();
})();
</script>
</body>
</html>
